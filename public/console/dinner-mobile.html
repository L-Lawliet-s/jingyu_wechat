<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>小鲸鱼 · 生活助手</title>
  <link rel="icon" href="/app-icon.png" type="image/png">
  <link rel="stylesheet" href="/dinner.css">
  <script type="module" src="/dinner-mobile.js"></script>
</head>
<body class="dinner-mobile">
  <main>
    <header class="dinner-mobile-header"><span>小鲸鱼</span><button id="dinner-unpair" class="dinner-button" type="button" hidden>退出手机端</button></header>
    <h1>生活助手</h1>
    <div id="dinner-mobile-app" class="dinner">
      <section id="dinner-pairing" class="dinner-card">
        <h2>与电脑配对</h2>
        <p>在电脑的「晚饭与晚间安排 → 连接手机」中获取配对码。</p>
        <form id="dinner-pair-form">
          <label>配对码<input name="code" type="text" maxlength="18" autocomplete="off" autocapitalize="characters" spellcheck="false" required></label>
          <div class="dinner-actions"><button class="dinner-button dinner-primary">连接</button></div>
        </form>
        <p id="dinner-pair-status" class="dinner-alert" role="status" hidden></p>
      </section>
    </div>
  </main>
</body>
</html>
